<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Touchline Manager</title>
<style>
:root{--ink:#17202a;--muted:#7a8491;--line:#e8edf1;--green:#12a066;--green2:#0c8052;--orange:#ff8a35;--red:#ed5a67;--panel:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#edf1f3;color:var(--ink);min-height:100vh}.app{max-width:430px;margin:auto;min-height:100vh;background:#f7f9fa;position:relative;overflow:hidden;box-shadow:0 0 40px #0001}.topbar{height:68px;padding:12px 16px 9px;display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--line);position:relative}.club-mark{width:42px;height:42px;border-radius:50%;background:#163c55;color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px;border:3px solid #fff;box-shadow:0 0 0 1px #d9e2e7}.club{margin-left:9px}.club small{display:block;color:#909aa3;font-size:10px;font-weight:700;letter-spacing:.7px}.club b{font-size:14px}.coins{margin-left:auto;background:#eef4f1;border-radius:18px;padding:7px 10px;font-weight:800;font-size:12px}.coins span{color:#dba51a;margin-right:4px}.iconbell{width:34px;height:34px;margin-left:5px;border:0;border-radius:50%;background:#fff;color:#73808a;font-size:17px}.main{height:calc(100vh - 68px - 68px);overflow-y:auto;padding-bottom:10px}.header-match{padding:13px 16px 9px}.match-meta{display:flex;justify-content:space-between;align-items:center}.league{display:flex;align-items:center;font-size:11px;color:#78848d;font-weight:800}.league i{width:20px;height:20px;border-radius:50%;background:#5ebc81;margin-right:6px}.live{color:#ef6666;font-size:10px;font-weight:900}.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#ef6666;margin-right:5px}.scoreboard{height:58px;display:flex;align-items:center;justify-content:center;gap:12px}.teammini{text-align:center;width:92px}.teammini .badge{margin:auto;width:30px;height:30px;border-radius:50% 50% 44% 44%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:900}.badge.cit{background:#5db8ca}.badge.arm{background:#6a446c}.teammini b{display:block;font-size:11px;margin-top:3px}.score{font-size:27px;font-weight:900;letter-spacing:2px}.minute{font-size:9px;color:#ed6666;font-weight:900;text-align:center}.pitch-wrap{padding:0 12px}.pitch{height:275px;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(90deg,#2aa866 0 12.5%,#249d5e 12.5% 25%,#2aa866 25% 37.5%,#249d5e 37.5% 50%,#2aa866 50% 62.5%,#249d5e 62.5% 75%,#2aa866 75% 87.5%,#249d5e 87.5%);box-shadow:inset 0 0 40px #174c2a22}.pitch:before{content:"";position:absolute;inset:8px;border:1.5px solid #ffffff80}.pitch:after{content:"";position:absolute;width:70px;height:70px;border:1.5px solid #ffffff80;border-radius:50%;left:calc(50% - 35px);top:calc(50% - 35px)}.halfline{position:absolute;height:100%;left:50%;width:1.5px;background:#ffffff80}.box{position:absolute;width:84px;height:32px;border:1.5px solid #ffffff80;left:calc(50% - 42px)}.box.top{top:8px}.box.bottom{bottom:8px}.goal{position:absolute;width:42px;height:10px;border:1.5px solid #fff9;left:calc(50% - 21px);}.goal.top{top:0}.goal.bottom{bottom:0}.goal{z-index:2}.player{position:absolute;width:24px;height:24px;border-radius:50%;z-index:4;color:#fff;font-size:8px;font-weight:900;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 5px #0005;transition:left .8s linear,top .8s linear}.player.home{background:#7db7cd}.player.away{background:#6f476f}.ball{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;z-index:6;box-shadow:0 1px 3px #0009;transition:left .8s linear,top .8s linear}.match-event{position:absolute;left:14px;right:14px;bottom:12px;height:36px;border-radius:8px;background:#183d42e8;color:#fff;z-index:8;display:flex;align-items:center;padding:7px 9px;font-size:10px;opacity:0;transform:translateY(8px);transition:.25s}.match-event.show{opacity:1;transform:none}.match-event b{margin-right:7px;width:23px;height:23px;background:#fff;color:#183d42;border-radius:50%;display:grid;place-items:center}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px}.tab{height:55px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#7e8992;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tab span{font-size:17px}.tab.active{background:#163c55;border-color:#163c55;color:#fff}.stats{margin:0 12px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px}.stat-row{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;font-size:9px;color:#7f8991;font-weight:800;margin:5px 0}.stat-row b{color:var(--ink);font-size:11px}.stat-row b:last-child{text-align:right}.bar{height:5px;background:#edf1f2;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#12a066;border-radius:5px}.bnav{position:absolute;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:20}.nav{border:0;background:none;color:#9aa3aa;font-size:9px;font-weight:800;text-align:center}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.nav.active{color:#14945f}.screen{display:none}.screen.active{display:block}.page-head{height:62px;padding:11px 16px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line);background:#fff}.page-head h2{margin:0;font-size:20px}.cards{padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;padding:12px}.fixture{display:flex;align-items:center}.fixture time{width:43px;font-size:9px;color:#929ba3;font-weight:800}.fixture .teams{flex:1;text-align:center;font-size:12px;font-weight:800}.fixture .result{width:48px;text-align:right;font-weight:900}.formation{height:260px;border-radius:12px;background:linear-gradient(135deg,#277c58,#31a66e);position:relative;color:#fff}.formation .p{position:absolute;width:38px;height:38px;border:2px solid #fff;border-radius:50%;background:#163c55;display:grid;place-items:center;font-size:11px;font-weight:900}.formation .p.hot{background:#ef8a3a}.tactic-row{display:flex;gap:7px;margin-top:9px}.tactic{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;height:49px;font-size:10px;font-weight:800}.tactic.selected{background:#163c55;color:#fff}.table-row{height:38px;display:grid;grid-template-columns:28px 1fr 35px 35px 35px;align-items:center;border-bottom:1px solid #edf1f2;font-size:11px}.table-row.head{color:#969fa6;font-size:9px;font-weight:900}.table-row b:last-child{text-align:center}.squad-row{height:54px;display:flex;align-items:center;border-bottom:1px solid #edf1f2}.avatar{width:34px;height:34px;border-radius:50%;background:#dce7ea;display:grid;place-items:center;margin-right:9px;font-weight:900;font-size:11px}.squad-row .name{flex:1;font-size:12px}.squad-row .name small{display:block;color:#979fa5;margin-top:2px}.rating{width:34px;height:34px;border-radius:8px;background:#eff5f2;color:#168358;display:grid;place-items:center;font-weight:900}.toast{position:absolute;z-index:30;left:50%;bottom:80px;transform:translate(-50%,20px);background:#17202a;color:#fff;border-radius:20px;padding:9px 14px;font-size:11px;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:720px){.pitch{height:245px}.main{height:calc(100vh - 68px - 68px)}}@media(min-width:431px){body{background:#dde5e7}.app{border-radius:18px;margin:14px auto;min-height:calc(100vh - 28px);height:calc(100vh - 28px)}.main{height:calc(100vh - 28px - 68px - 68px)}.bnav{bottom:14px}.topbar{border-radius:18px 18px 0 0}}
</style></head><body><div class="app">
<header class="topbar"><div class="club-mark">MCR</div><div class="club"><small>LEAGUE CLUB</small><b>Manchester City</b></div><div class="coins"><span>◆</span>18,450</div><button class="iconbell">♧</button></header>
<main class="main">
<section id="match" class="screen active"><div class="header-match"><div class="match-meta"><div class="league"><i></i> Premier Division</div><div class="live">LIVE MATCH</div></div><div class="scoreboard"><div class="teammini"><div class="badge cit">MCI</div><b>Manchester</b></div><div><div class="score"><span id="hs">1</span> - <span id="as">0</span></div><div class="minute" id="minute">38'</div></div><div class="teammini"><div class="badge arm">ARS</div><b>Arsenal</b></div></div></div>
<div class="pitch-wrap"><div class="pitch" id="pitch"><div class="halfline"></div><div class="box top"></div><div class="box bottom"></div><div class="goal top"></div><div class="goal bottom"></div><div id="players"></div><div class="ball" id="ball"></div><div class="match-event" id="event"><b>⚽</b><span id="eventText">Goal! M. Silva</span></div></div></div>
<div class="tabs"><button class="tab active" data-tactical="Attacking"><span>⚔</span>ATTACK</button><button class="tab" data-tactical="Balanced"><span>≡</span>BALANCE</button><button class="tab" data-tactical="Defending"><span>◆</span>DEFEND</button><button class="tab" data-tactical="Pressing"><span>⌁</span>PRESS</button></div>
<div class="stats"><div class="stat-row"><b id="possH">54%</b><span class="bar"><i id="possBar" style="width:54%"></i></span><b id="possA">46%</b></div><div class="stat-row"><b>Possession</b><span></span><b></b></div><div class="stat-row"><b id="shotsH">6</b><span class="bar"><i id="shotsBar" style="width:58%"></i></span><b id="shotsA">4</b></div><div class="stat-row"><b>Shots</b><span></span><b></b></div><div class="stat-row"><b id="sotH">3</b><span class="bar"><i id="sotBar" style="width:60%"></i></span><b id="sotA">2</b></div><div class="stat-row"><b>On target</b><span></span><b></b></div></div></section>
<section id="squad" class="screen"><div class="page-head"><h2>Squad</h2></div><div class="cards"><div class="card" style="padding:8px 12px" id="squadList"></div></div></section>
<section id="tactics" class="screen"><div class="page-head"><h2>Tactics</h2></div><div class="cards"><div class="card"><div class="formation" id="formation"><div class="p hot" style="left:44%;top:82%">9</div><div class="p" style="left:18%;top:60%">11</div><div class="p" style="left:70%;top:60%">7</div><div class="p" style="left:44%;top:51%">10</div><div class="p" style="left:15%;top:32%">8</div><div class="p" style="left:72%;top:32%">6</div><div class="p" style="left:20%;top:14%">3</div><div class="p" style="left:44%;top:12%">5</div><div class="p" style="left:69%;top:14%">2</div><div class="p" style="left:44%;top:92%">1</div></div><div class="tactic-row"><button class="tactic selected">4–3–3<br>Attack</button><button class="tactic">4–2–3–1<br>Balanced</button><button class="tactic">5–4–1<br>Defend</button></div></div></div></section>
<section id="fixtures" class="screen"><div class="page-head"><h2>Fixtures</h2></div><div class="cards" id="fixturesList"></div></section>
<section id="table" class="screen"><div class="page-head"><h2>Standings</h2></div><div class="cards"><div class="card" id="tableList"></div></div></section>
</main>
<nav class="bnav"><button class="nav active" data-screen="match"><i>◉</i>MATCH</button><button class="nav" data-screen="squad"><i>♟</i>SQUAD</button><button class="nav" data-screen="tactics"><i>▦</i>TACTICS</button><button class="nav" data-screen="fixtures"><i>▣</i>FIXTURES</button><button class="nav" data-screen="table"><i>≋</i>TABLE</button></nav><div class="toast" id="toast"></div>
</div>
<script>
const pitch=document.getElementById('pitch'),players=document.getElementById('players'),ball=document.getElementById('ball');let minute=38,hs=1,as=0,shotsH=6,shotsA=4,sotH=3,sotA=2,possH=54,tactical='Attacking';
const home=[[50,93],[23,72],[42,77],[64,77],[79,72],[15,49],[38,52],[62,52],[84,49],[31,27],[57,26],[70,16],[27,17],[44,9],[58,15]],away=[[50,7],[20,27],[40,23],[61,23],[80,28],[17,50],[40,47],[63,47],[83,51],[35,72],[60,73],[47,82],[27,66],[68,67],[50,61]];
for(let i=0;i<15;i++){let p=document.createElement('div');p.className='player '+(i<7?'home':'away');p.dataset.i=i;p.textContent=i<7?['GK','LB','CB','CB','RB','CM','CM','CM','CM','LW','RW','ST','LW','RW','ST'][i]:(i-7+1);players.appendChild(p)}
function place(){[...document.querySelectorAll('.player')].forEach((p,i)=>{let q=i<7?home[i]:away[i-7];p.style.left=`calc(${q[0]}% - 12px)`;p.style.top=`calc(${q[1]/100*275}px - 12px)`});ball.style.left='calc(56% - 3px)';ball.style.top='170px'}place();
setInterval(()=>{if(document.hidden)return;minute=Math.min(90,minute+(minute<90?1:0));document.getElementById('minute').textContent=minute+"'";if(minute>=90){minute=90;clearMatchEvents()}else move},900);
function move(){document.querySelectorAll('.player').forEach((p,i)=>{let isHome=i<7;let q=isHome?home[i]:away[i-7];let drift=tactical==='Pressing'||tactical==='Attacking'?1.6:-1.1;q[0]=Math.max(5,Math.min(95,q[0]+(Math.random()*5-2.5)));q[1]=Math.max(5,Math.min(95,q[1]+((isHome?drift:-drift)*(Math.random()-.35))*(tactical==='Defending'?-.5:1)))});ball.style.left=(45+Math.random()*22)+'%';ball.style.top=(40+Math.random()*160)+'px';place();if(Math.random()<.075){matchEvent()}if(Math.random()<.08)possH=Math.max(40,Math.min(66,possH+(Math.random()*4-2)));updateStats()}
function matchEvent(){shotsH+=Math.random()<.65?1:0;shotsA+=Math.random()<.35?1:0;let goal=Math.random()<.18;if(goal){hs++;document.getElementById('hs').textContent=hs;showEvent('⚽','Goal! '+['B. Silva','Haaland','Foden','De Bruyne'][Math.floor(Math.random()*4)])}else if(Math.random()<.5)showEvent('↗','Shot on target — close!');else showEvent('◆','Arsenal wins possession')}
function clearMatchEvents(){}
function showEvent(icon,text){let e=document.getElementById('event');document.getElementById('eventText').textContent=text;e.querySelector('b').textContent=icon;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function updateStats(){document.getElementById('possH').textContent=possH+'%';document.getElementById('possA').textContent=(100-possH)+'%';document.getElementById('possBar').style.width=possH+'%';document.getElementById('shotsH').textContent=shotsH;document.getElementById('shotsA').textContent=shotsA;document.getElementById('shotsBar').style.width=(shotsH/(shotsH+shotsA)*100)+'%';document.getElementById('sotH').textContent=sotH;document.getElementById('sotA').textContent=sotA;document.getElementById('sotBar').style.width=(sotH/(sotH+sotA)*100)+'%'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tactical=b.dataset.tactical;toast(tactical+' mentality set')});
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active')});
function toast(text){let t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
const squad=[['E. Haaland','ST','9','92'],['Kevin De Bruyne','CM','17','91'],['Bernardo Silva','RW','20','89'],['Rúben Dias','CB','3','88'],['Rodri','CDM','16','90'],['Ederson','GK','31','89']];document.getElementById('squadList').innerHTML=squad.map(s=>`<div class="squad-row"><div class="avatar">${s[2]}</div><div class="name"><b>${s[0]}</b><small>${s[1]} · Squad</small></div><div class="rating">${s[3]}</div></div>`).join('');
const fix=[['SAT 24','Manchester City','Arsenal','1 – 0'],['SUN 25','Newcastle','Manchester City','18:00'],['SAT 31','Manchester City','Liverpool','15:00']];document.getElementById('fixturesList').innerHTML=fix.map(f=>`<div class="card fixture"><time>${f[0]}</time><div class="teams">${f[1]}<br><small style="color:#aaa">vs</small><br>${f[2]}</div><div class="result">${f[3]}</div></div>`).join('');
const table=[['1','Manchester City','18','41'],['2','Arsenal','18','38'],['3','Liverpool','18','36'],['4','Aston Villa','18','32'],['5','Tottenham','18','30']];document.getElementById('tableList').innerHTML='<div class="table-row head"><b>#</b><b>TEAM</b><b>PL</b><b>PTS</b><b>GD</b></div>'+table.map((r,i)=>`<div class="table-row"><b>${r[0]}</b><b>${r[1]}</b><b>${r[2]}</b><b>${r[3]}</b><b>+${16-i*3}</b></div>`).join('');
document.querySelectorAll('.tactic').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tactic').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');toast(b.innerText.replace('\n',' ')+' formation')});
setTimeout(()=>showEvent('⚽','Goal! M. Silva'),700);
</script></body></html>
